<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="科室排班静态预览，按日期、岗位和人员查看月度排班。" />
    <title>科室排班总览</title>
    <link rel="icon" type="image/png" href="./assets/VetVault-Logo.png?v=1" />
    <link rel="apple-touch-icon" href="./assets/VetVault-Logo.png" />
    <link rel="stylesheet" href="./assets/styles.css?v=16" />
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <div>
          <h1>排班总览</h1>
        </div>
        <div class="period-card" aria-label="当前排班周期">
          <span>排班周期</span>
          <strong id="period-label">2026.08.31 — 09.27</strong>
          <em id="version-status">正在载入版本…</em>
        </div>
      </header>

      <section class="toolbar" aria-label="页面工具">
        <label class="version-field">
          <span>排班版本</span>
          <select id="version-select" aria-label="选择排班版本"></select>
        </label>
        <label class="search-field">
          <span>查找人员</span>
          <input id="person-search" type="search" placeholder="输入姓名" autocomplete="off" />
        </label>
        <label class="version-field">
          <span>个人日历</span>
          <select id="ics-person-select" aria-label="选择导出日历的人员"></select>
        </label>
        <button class="secondary-button draft-button" id="draft-button" type="button">暂存</button>
        <button class="secondary-button save-button" id="save-version-button" type="button">保存到云端</button>
        <button class="secondary-button export-button" id="export-button" type="button">导出 Excel</button>
        <button class="secondary-button ics-button" id="ics-export-button" type="button">导出个人日历</button>
        <div class="summary" aria-label="排班摘要">
          <div><span>人员</span><strong id="people-count">45</strong></div>
          <div><span>工种</span><strong>17</strong></div>
          <div><span>天数</span><strong id="day-count">28</strong></div>
        </div>
      </section>

      <section class="panel" id="heatmap-view" aria-label="人员排班热力图">
        <header class="panel-header heatmap-header">
          <div>
            <h2>人员每日排班</h2>
            <p id="heatmap-swap-status">点格换班</p>
            <div class="streak-legend" aria-label="连续工作提示">
              <span><i class="streak-six"></i>连上6天</span>
              <span><i class="streak-over"></i>连上&gt;6天</span>
              <span><i class="night-streak"></i>连夜≥3天</span>
            </div>
          </div>
          <button class="shift-label-toggle" id="shift-label-toggle" type="button" aria-pressed="false">显示标签</button>
        </header>
        <div class="annotation-toolbar" aria-label="热力图标注工具">
          <div class="annotation-heading">
            <strong>标注排班</strong>
            <span id="annotation-status" aria-live="polite">选标签，再点单元格</span>
          </div>
          <div class="annotation-buttons" id="annotation-buttons">
            <button type="button" data-annotation="day">白班</button>
            <button type="button" data-annotation="night">夜班</button>
            <button type="button" data-annotation="xray">X线</button>
            <button type="button" data-annotation="ct">CT/MRI</button>
            <button type="button" data-annotation="us">超声</button>
            <button type="button" data-annotation="outpatient">门诊</button>
            <button type="button" data-annotation="annual-leave">年假</button>
            <button type="button" data-annotation="rest">普休</button>
            <button type="button" data-annotation="expansion">拓展</button>
            <button type="button" data-annotation="no-night">不夜</button>
            <button type="button" data-annotation="management">管理</button>
            <button type="button" class="annotation-cancel" data-annotation="cancel">取消指定</button>
          </div>
        </div>
        <div class="heatmap-scroll">
          <div id="heatmap"></div>
        </div>
      </section>

      <section class="panel" id="table-view" aria-label="排班总表">
        <header class="panel-header">
          <div>
            <h2>每日岗位安排</h2>
          </div>
          <p id="table-filter-state">拖动姓名换班</p>
        </header>
        <div class="table-scroll">
          <table id="schedule-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="panel" id="room-chart-view" aria-label="超声三号屋与四号屋统计">
        <header class="panel-header">
          <div>
            <h2>超声三号屋 / 四号屋人次</h2>
          </div>
        </header>
        <div class="room-chart-scroll">
          <div id="room-chart"></div>
        </div>
      </section>

    </main>
    <div class="loading-screen" id="loading-screen" aria-live="polite">正在载入排班数据…</div>
    <script src="./assets/highcharts.js"></script>
    <script src="./assets/heatmap.js"></script>
    <script src="./assets/exceljs.min.js"></script>
    <script src="./assets/supabase-config.js"></script>
    <script src="./assets/schedule-api.js"></script>
    <script type="module" src="./assets/app.js?v=29"></script>
  </body>
</html>
