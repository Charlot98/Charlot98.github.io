<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="科室排班静态预览，按日期、岗位和人员查看月度排班。" />
    <title>科室排班总览</title>
    <link rel="icon" type="image/png" href="./assets/VetVault-Logo.png?v=1" />
    <link rel="apple-touch-icon" href="./assets/VetVault-Logo.png" />
    <link rel="stylesheet" href="./assets/styles.css?v=2" />
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <div>
          <h1>排班总览</h1>
        </div>
        <div class="period-card" aria-label="当前排班周期">
          <span>排班周期</span>
          <strong>2026.08.31 — 09.27</strong>
          <em>第27版 · 已确认</em>
        </div>
      </header>

      <section class="toolbar" aria-label="页面工具">
        <div class="view-tabs" role="tablist" aria-label="视图切换">
          <button class="view-tab is-active" type="button" data-view="table" role="tab" aria-selected="true">排班总表</button>
          <button class="view-tab" type="button" data-view="heatmap" role="tab" aria-selected="false">人员热力图</button>
        </div>
        <label class="search-field">
          <span>查找人员</span>
          <input id="person-search" type="search" placeholder="输入姓名" autocomplete="off" />
        </label>
        <button class="secondary-button export-button" id="export-button" type="button">导出 Excel</button>
        <div class="summary" aria-label="排班摘要">
          <div><span>人员</span><strong id="people-count">45</strong></div>
          <div><span>工种</span><strong>15</strong></div>
          <div><span>天数</span><strong>28</strong></div>
        </div>
      </section>

      <section class="panel" id="table-view" aria-label="排班总表">
        <header class="panel-header">
          <div>
            <h2>每日岗位安排</h2>
          </div>
          <p id="table-filter-state">拖动姓名调整岗位或夜班日期</p>
        </header>
        <div class="table-scroll">
          <table id="schedule-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="panel is-hidden" id="heatmap-view" aria-label="人员排班热力图">
        <header class="panel-header heatmap-header">
          <div>
            <h2>人员每日排班</h2>
          </div>
          <button class="shift-label-toggle" id="shift-label-toggle" type="button" aria-pressed="false">显示标签</button>
        </header>
        <div class="heatmap-scroll">
          <div id="heatmap"></div>
        </div>
      </section>

    </main>
    <div class="loading-screen" id="loading-screen" aria-live="polite">正在载入排班数据…</div>
    <script src="./assets/highcharts.js"></script>
    <script src="./assets/heatmap.js"></script>
    <script src="./assets/exceljs.min.js"></script>
    <script type="module" src="./assets/app.js?v=3"></script>
  </body>
</html>
