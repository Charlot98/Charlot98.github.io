<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/VetVault-Logo.png" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: #fff;
        color: #000;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      body::after {
        content: "";
        position: fixed;
        left: -10%;
        right: -10%;
        bottom: -28%;
        height: 52vh;
        background: linear-gradient(90deg, #d7f0e4 0%, #d4e8f8 100%);
        filter: blur(72px);
        opacity: 0.85;
        pointer-events: none;
      }

      main {
        position: relative;
        z-index: 1;
        text-align: center;
        margin-top: -6vh;
        padding: 24px;
      }

      h1 {
        margin: 0;
        font-size: clamp(72px, 14vw, 104px);
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1;
      }

      p {
        margin: 18px 0 0;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>no pages</p>
    </main>
  </body>
</html>
