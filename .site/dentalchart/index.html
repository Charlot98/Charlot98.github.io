<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>牙表</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/pub.css?v=20260810-3">
    <link rel="stylesheet" href="css/app-ui.css?v=20260810-4">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div></div>
            <nav class="main-nav" aria-label="主导航">
                <button type="button" class="active">牙表填写</button>
                <button type="button" onclick="saveDraftAndOpenHistory()">历史记录</button>
            </nav>
            <div></div>
        </header>

        <main class="workspace">
            <div class="control-row">
                <section class="term-bar" aria-label="牙病术语">
                    <div class="legend legend--collapsed">
                        <div class="legend-grid" id="legendGrid">
                            <div class="legend-primary-grid" id="legendPrimaryGrid">
                                <button type="button" class="legend-add-btn" id="legendAddBtn" onclick="openTermModal()" title="新建标签" aria-label="新建标签">＋</button>
                            </div>
                            <div class="legend-other-grid" id="legendOtherGrid"></div>
                        </div>
                        <button type="button" class="legend-more-btn" id="legendMoreBtn" onclick="toggleOtherTerms()" title="展开其他术语" aria-label="展开其他术语" aria-expanded="false"><span aria-hidden="true">▾</span></button>
                    </div>
                    <div class="term-search-actions">
                        <label class="term-search">
                            <span aria-hidden="true">⌕</span>
                            <input type="search" id="legendSearch" class="legend-search" placeholder="检索缩写或中文" autocomplete="off" aria-label="检索术语缩写或中文">
                        </label>
                    </div>
                </section>
            </div>

            <div class="content-grid">
                <section class="chart-card">
                    <div class="section-heading">
                        <div class="patient-inline">
                            <div class="owner-search-field">
                                <label><span>家长</span><input type="text" id="ownerNameInput" class="owner-name-input" autocomplete="off" aria-label="家长" aria-controls="ownerSearchResults" aria-expanded="false"></label>
                                <div class="owner-search-results" id="ownerSearchResults" role="listbox" aria-label="匹配的历史牙表" hidden></div>
                            </div>
                            <label><span>动物</span><input type="text" id="petNameInput" class="owner-name-input" autocomplete="off" aria-label="动物"></label>
                        </div>
                    </div>

                    <div class="chart-container" id="chartContainer">
                        <img id="chartImage" src="image/CANINE.png" alt="牙表" class="chart-image" draggable="false">
                        <div id="inputsContainer"></div>
                    </div>
                    <div class="rabbit-poster" id="rabbitPoster">
                        <img src="image/rabbit-dental-anatomy-poster_223f9cd7-9074-4ce6-8b45-e4d403c71fac.webp" alt="兔牙解剖图" class="rabbit-poster-image">
                    </div>
                    <div class="chart-bottom-row">
                        <div class="workflow-control">
                            <div class="workflow-actions" aria-label="牙表保存操作">
                                <span class="save-status" id="saveStatus">尚未保存</span>
                                <button type="button" class="btn-restore-draft" id="restoreDraftButton" onclick="restoreCurrentDraft()" hidden>恢复当前填写</button>
                                <button type="button" class="btn-save" id="saveChartButton" onclick="saveChart()">保存</button>
                                <span class="workflow-divider" aria-hidden="true"></span>
                                <button type="button" class="btn-clear" onclick="clearAll()" aria-label="清空" title="清空">清空</button>
                            </div>
                        </div>
                    </div>
                </section>

                <div class="side-column">
                    <section class="chart-type-bar" aria-label="牙表类型">
                        <div class="chart-type-selector" role="group" aria-label="选择牙表类型">
                            <button id="btn-dog" class="active" onclick="switchChart('dog')">犬</button>
                            <button id="btn-cat" onclick="switchChart('cat')">猫</button>
                            <button id="btn-rabbit" onclick="switchChart('rabbit')">兔</button>
                        </div>
                    </section>
                    <aside class="report-card">
                        <div class="report-card-header">
                            <div class="report-tabs" role="tablist" aria-label="报告类型">
                                <button type="button" id="currentReportTab" class="active" role="tab" aria-selected="true" aria-controls="currentReportPanel" onclick="switchReportTab('current')">当前报告</button>
                                <button type="button" id="historyReportTab" role="tab" aria-selected="false" aria-controls="historyReportPanel" onclick="switchReportTab('history')">历史报告</button>
                            </div>
                        </div>
                        <div class="report-panel" id="currentReportPanel" role="tabpanel" aria-labelledby="currentReportTab">
                            <div class="report-grid">
                                <div class="report-section">
                                    <div class="report-section-header"><h4>所见</h4><button type="button" class="report-copy-btn" onclick="copyReportText('reportFindings', this)" aria-label="复制所见" title="复制所见"></button></div>
                                    <textarea id="reportFindings" class="report-textarea report-textarea--empty" rows="12" readonly></textarea>
                                </div>
                                <div class="report-section">
                                    <div class="report-section-header"><h4>结论</h4><button type="button" class="report-copy-btn" onclick="copyReportText('reportConclusion', this)" aria-label="复制结论" title="复制结论"></button></div>
                                    <textarea id="reportConclusion" class="report-textarea report-textarea--empty" rows="12" readonly></textarea>
                                </div>
                            </div>
                        </div>
                        <div class="history-report-panel" id="historyReportPanel" role="tabpanel" aria-labelledby="historyReportTab" hidden>
                            <div class="history-report-empty" id="historyReportEmpty">暂无历史报告</div>
                            <div class="history-report-list" id="historyReportList"></div>
                        </div>
                    </aside>
                </div>
            </div>
        </main>
    </div>

    <div id="termModal" class="term-modal" hidden>
        <div class="term-modal-backdrop" onclick="closeTermModal()"></div>
        <form class="term-modal-panel" onsubmit="addCustomTerm(event)" role="dialog" aria-modal="true" aria-labelledby="termModalTitle">
            <div class="term-modal-header">
                <div><h2 id="termModalTitle">新建标签</h2></div>
          
                <button type="button" onclick="closeTermModal()" aria-label="关闭">×</button>
            </div>
            <label class="term-field"><span>缩写 <b>*</b></span><input id="termAbbreviationInput" maxlength="30" autocomplete="off" placeholder="例如：DTR 或 中文标签" oninput="updateTermFullNameRequirement()"></label>
            <label class="term-field"><span>全称 <b id="termFullNameRequired">*</b></span><input id="termFullNameInput" maxlength="60" autocomplete="off" placeholder="例如：牙本质修复"></label>
            <p class="term-modal-hint" id="termModalHint">英文或数字缩写需要填写全称</p>
            <div class="term-modal-actions">
                <button type="button" onclick="closeTermModal()">取消</button>
                <button type="submit" class="primary" id="termSubmitButton">添加标签</button>
            </div>
        </form>
    </div>

            PD: 'AL',

        const TERM_DISPLAY_NAMES = {
            髓腔增宽: '髓腔宽'
        };

        function resolveTermAlias(term) {
            if (TERM_ALIASES[term]) return TERM_ALIASES[term];
            if (term.startsWith('疑')) {
                const baseTerm = term.slice(1);
                if (TERM_ALIASES[baseTerm]) return '疑' + TERM_ALIASES[baseTerm];
            }
            return term;
        }

        function getTermDisplayName(term) {
            if (TERM_DISPLAY_NAMES[term]) return TERM_DISPLAY_NAMES[term];
            if (term.startsWith('疑')) {
                const baseTerm = term.slice(1);
                if (TERM_DISPLAY_NAMES[baseTerm]) {
                    return '疑' + TERM_DISPLAY_NAMES[baseTerm];
                }
            }
            return term;
        }

            year: 'numeric', month: '2-digit', day: '2-digit'
        });
        function createEditSessionId() {
            return globalThis.crypto?.randomUUID
                ? globalThis.crypto.randomUUID()
                : Date.now() + '-' + Math.random().toString(36).slice(2);
        }

        async function fetchWithTimeout(resource, options = {}, timeout = API_TIMEOUT_MS) {
            await DentalApi.ensureAccess();
            if (!globalThis.AbortController) return DentalApi.fetch(resource, options);
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeout);
            return DentalApi.fetch(resource, { ...options, signal: controller.signal })
                .finally(() => clearTimeout(timer));
        }

        function getAllAnnotationTerms() {
            const abbreviations = customTerms.map(term => term.abbreviation);
            return [...ANNOTATION_TERMS, ...abbreviations.filter(term => !ANNOTATION_TERMS.includes(term))];
        }

        async function loadCustomTerms(render = true) {
            try {
                const response = await fetchWithTimeout(CUSTOM_TERMS_API, { cache: 'no-store' });
                if (!response.ok) return;
                const data = await response.json();
                const nextTerms = Array.isArray(data.terms)
                    ? data.terms.map(term => typeof term === 'string'
                        ? { abbreviation: term, fullName: '' }
                        : term).filter(term => term?.abbreviation)
                    : [];
                const signature = JSON.stringify(nextTerms);
                if (signature === customTermsSignature) return;
                customTerms = nextTerms;
                customTermsSignature = signature;
                if (render) {
                    const selected = activeLegendTerm;
                    initLegend();
                    setActiveLegendTerm(selected);
                }
            } catch (_) {
                // 服务暂时不可用时保留当前标签，下次轮询自动重试。
            }
        }

        function openTermModal() {
            const modal = document.getElementById('termModal');
            if (!modal) return;
            modal.hidden = false;
            document.getElementById('termAbbreviationInput').value = '';
            document.getElementById('termFullNameInput').value = '';
            updateTermFullNameRequirement();
            requestAnimationFrame(() => document.getElementById('termAbbreviationInput').focus());
        }

        function closeTermModal() {
            const modal = document.getElementById('termModal');
            if (modal) modal.hidden = true;
        }

        function updateTermFullNameRequirement() {
            const abbreviation = document.getElementById('termAbbreviationInput')?.value.trim() || '';
            const hasChinese = /[\u3400-\u9fff]/.test(abbreviation);
            const fullName = document.getElementById('termFullNameInput');
            const requiredMark = document.getElementById('termFullNameRequired');
            const hint = document.getElementById('termModalHint');
            if (fullName) fullName.required = !hasChinese;
            if (requiredMark) requiredMark.hidden = hasChinese;
            if (hint) hint.textContent = hasChinese ? '中文缩写可直接作为报告关键词，全称可以不填' : '英文或数字缩写需要填写全称';
        }

        async function addCustomTerm(event) {
            event?.preventDefault();
            const abbreviation = document.getElementById('termAbbreviationInput').value.trim().toUpperCase();
            const fullName = document.getElementById('termFullNameInput').value.trim();
            const hasChinese = /[\u3400-\u9fff]/.test(abbreviation);
            if (!abbreviation || (!hasChinese && !fullName)) return;
            const submitButton = document.getElementById('termSubmitButton');
            submitButton.disabled = true;
            submitButton.textContent = '正在添加...';
            try {
                const response = await DentalApi.fetch(CUSTOM_TERMS_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ abbreviation, fullName })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || '添加失败');
                customTerms = Array.isArray(data.terms)
                    ? data.terms.map(term => typeof term === 'string' ? { abbreviation: term, fullName: '' } : term)
                    : customTerms;
                customTermsSignature = JSON.stringify(customTerms);
                initLegend();
                const legend = document.querySelector('.legend');
                const moreButton = document.getElementById('legendMoreBtn');
                legend?.classList.remove('legend--collapsed');
                if (moreButton) {
                    moreButton.title = '收起其他术语';
                    moreButton.setAttribute('aria-label', '收起其他术语');
                    moreButton.setAttribute('aria-expanded', 'true');
                }
                setActiveLegendTerm(data.added || abbreviation);
                closeTermModal();
            } catch (error) {
                alert(`添加标签失败：${error.message}`);
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = '添加标签';
            }
        }

        function setSaveStatus(text, state = '') {
            const element = document.getElementById('saveStatus');
            if (!element) return;
            element.textContent = text;
            element.dataset.state = state;
        }

        function collectVisibleInputData() {
            const data = {};
            document.querySelectorAll('.tooth-input').forEach(input => {
                if (input.value) {
                    data[input.id.replace('tooth-', '')] = input.value;
                }
            });
            return data;
        }

        function getCurrentChartPayload() {
            return {
                ownerName: document.getElementById('ownerNameInput')?.value.trim() || '',
                petName: document.getElementById('petNameInput')?.value.trim() || '',
                chartType: currentChartType,
                inputData: collectVisibleInputData(),
                editSessionId,
                workflowStatus: 'saved',
                medicalRecordId: currentMedicalRecordId || undefined
            };
        }

        function hasChartContent(payload) {
            return Boolean(
                payload.ownerName ||
                payload.petName ||
                Object.keys(payload.inputData || {}).length
            );
        }

        function historyDateKey(value) {
            const date = new Date(Number(value));
            return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, '0'), String(date.getDate()).padStart(2, '0')].join('-');
        }

        function switchReportTab(tab) {
            activeReportTab = tab === 'history' ? 'history' : 'current';
            const current = activeReportTab === 'current';
            document.getElementById('currentReportTab').classList.toggle('active', current);
            document.getElementById('currentReportTab').setAttribute('aria-selected', String(current));
            document.getElementById('historyReportTab').classList.toggle('active', !current);
            document.getElementById('historyReportTab').setAttribute('aria-selected', String(!current));
            document.getElementById('currentReportPanel').hidden = !current;
            document.getElementById('historyReportPanel').hidden = current;
            if (!current) loadHistoricalReports();
        }

        function createHistoricalReportSection(title, text) {
            const section = document.createElement('section');
            section.className = 'report-section';
            const heading = document.createElement('div');
            heading.className = 'report-section-header';
            const label = document.createElement('h4');
            label.textContent = title;
            heading.appendChild(label);
            const textarea = document.createElement('textarea');
            textarea.className = 'report-textarea' + (text ? '' : ' report-textarea--empty');
            textarea.readOnly = true;
            textarea.rows = 5;
            textarea.value = text || '';
            section.append(heading, textarea);
            return section;
        }

        function expandHistoricalReportItems(records) {
            const items = [];
            (Array.isArray(records) ? records : []).forEach(record => {
                const versions = Array.isArray(record.versions) && record.versions.length
                    ? record.versions
                    : [{
                        version: record.selectedVersion || record.version || null,
                        createdAt: record.createdAt,
                        updatedAt: record.updatedAt,
                        ownerName: record.ownerName,
                        petName: record.petName,
                        chartType: record.chartType,
                        inputData: record.inputData || {}
                    }];
                versions.forEach(version => {
                    const stamp = Number(version.updatedAt || version.createdAt || 0);
                    items.push({
                        id: record.id,
                        version: version.version || null,
                        createdAt: Number(version.createdAt || stamp),
                        updatedAt: stamp,
                        ownerName: version.ownerName || record.ownerName || '',
                        petName: version.petName || record.petName || '',
                        chartType: version.chartType || record.chartType || 'dog',
                        inputData: version.inputData || {}
                    });
                });
            });
            return items;
        }

        function renderHistoricalReports(records) {
            const list = document.getElementById('historyReportList');
            const empty = document.getElementById('historyReportEmpty');
            list.innerHTML = '';
            const items = expandHistoricalReportItems(records);
            let currentLatest = null;
            if (currentChartId) {
                currentLatest = items
                    .filter(item => item.id === currentChartId)
                    .sort((a, b) => Number(b.updatedAt) - Number(a.updatedAt))[0] || null;
            }
            const byDate = new Map();
            items.forEach(item => {
                // 当前牙表最新一天归入「当前报告」，历史报告中不再重复展示。
                if (
                    currentLatest &&
                    item.id === currentChartId &&
                    historyDateKey(item.updatedAt) === historyDateKey(currentLatest.updatedAt)
                ) {
                    return;
                }
                const key = historyDateKey(item.updatedAt);
                const previous = byDate.get(key);
                if (!previous || Number(item.updatedAt) > Number(previous.updatedAt)) byDate.set(key, item);
            });
            const entries = [...byDate.values()].sort((a, b) => Number(b.updatedAt) - Number(a.updatedAt));
            empty.hidden = entries.length > 0;

            entries.forEach((record, index) => {
                const report = DentalReport.buildReport(record.inputData || {});
                const group = document.createElement('section');
                group.className = 'history-report-group';
                group.title = '双击可在左侧查看当日牙表';
                const header = document.createElement('button');
                header.type = 'button';
                header.className = 'history-report-date';
                header.setAttribute('aria-expanded', String(index === 0));
                const date = document.createElement('strong');
                date.textContent = historyDateFormatter.format(new Date(Number(record.updatedAt || record.createdAt)));
                const arrow = document.createElement('span');
                arrow.textContent = '›';
                header.append(date, arrow);
                const panel = document.createElement('div');
                panel.className = 'history-report-content';
                panel.hidden = index !== 0;
                panel.append(
                    createHistoricalReportSection('所见', report.empty ? '' : report.findings),
                    createHistoricalReportSection('结论', report.empty ? '' : report.conclusion)
                );
                let clickTimer = null;
                header.addEventListener('click', () => {
                    clearTimeout(clickTimer);
                    clickTimer = setTimeout(() => {
                        const expanded = header.getAttribute('aria-expanded') === 'true';
                        header.setAttribute('aria-expanded', String(!expanded));
                        panel.hidden = expanded;
                    }, 180);
                });
                group.addEventListener('dblclick', event => {
                    event.preventDefault();
                    clearTimeout(clickTimer);
                    previewHistoricalReport(record);
                });
                group.append(header, panel);
                list.appendChild(group);
            });
        }

        async function loadHistoricalReports(force = false) {
            const empty = document.getElementById('historyReportEmpty');
            const list = document.getElementById('historyReportList');
            if (!currentMedicalRecordId && !currentChartId) {
                list.innerHTML = '';
                empty.hidden = false;
                empty.textContent = '暂无历史报告';
                return;
            }
            const cacheKey = `${currentMedicalRecordId || 'none'}:${currentChartId || 'new'}`;
            if (!force && historicalReportsCacheKey === cacheKey) return;
            empty.hidden = false;
            empty.textContent = '正在读取历史报告...';
            list.innerHTML = '';
            try {
                let records = [];
                if (currentMedicalRecordId) {
                    const response = await fetchWithTimeout(`${MEDICAL_HISTORY_API}/${encodeURIComponent(currentMedicalRecordId)}/charts`, { cache: 'no-store' });
                    if (!response.ok) throw new Error((await response.json()).message || '读取失败');
                    records = await response.json();
                    if (!Array.isArray(records)) records = [];
                }
                if ((!records.length || !records.some(item => Array.isArray(item.versions) && item.versions.length)) && currentChartId) {
                    const detailResponse = await fetchWithTimeout(`${CHART_API}/${currentChartId}`, { cache: 'no-store' });
                    if (detailResponse.ok) {
                        const detail = await detailResponse.json();
                        if (!currentMedicalRecordId && detail.medicalRecordId) currentMedicalRecordId = detail.medicalRecordId;
                        const exists = records.some(item => item.id === detail.id);
                        if (!exists) records = [detail, ...records];
                        else {
                            records = records.map(item => item.id === detail.id ? detail : item);
                        }
                    }
                }
                historicalReportsCacheKey = cacheKey;
                empty.textContent = '暂无历史报告';
                renderHistoricalReports(records);
            } catch (error) {
                empty.hidden = false;
                empty.textContent = `读取失败：${error.message}`;
            }
        }

        function persistWorkingDraft() {
            if (viewOnlyMode) return;
            try {
                const snapshot = historyPreviewActive && currentDraftSnapshot
                    ? currentDraftSnapshot
                    : captureCurrentDraft();
                const hasContent = Boolean(
                    snapshot.ownerName ||
                    snapshot.petName ||
                    Object.keys(snapshot.inputData || {}).length
                );
                if (!hasContent && !snapshot.chartId) {
                    sessionStorage.removeItem(WORKING_DRAFT_KEY);
                    return;
                }
                sessionStorage.setItem(WORKING_DRAFT_KEY, JSON.stringify({ ...snapshot, savedAt: Date.now() }));
            } catch (_) {
                // 浏览器禁用会话存储时，继续使用服务端实时保存。
            }
        }

        function restoreWorkingDraftFromSession() {
            if (currentChartId || followupMode) return false;
            try {
                const raw = sessionStorage.getItem(WORKING_DRAFT_KEY);
                if (!raw) return false;
                const snapshot = JSON.parse(raw);
                if (!snapshot || typeof snapshot !== 'object') return false;
                currentChartId = snapshot.chartId || '';
                currentMedicalRecordId = snapshot.medicalRecordId || '';
                selectedHistoryVersion = Number(snapshot.selectedVersion) || null;
                editSessionId = snapshot.editSessionId || createEditSessionId();
                currentChartType = ['dog', 'cat', 'rabbit'].includes(snapshot.chartType) ? snapshot.chartType : 'dog';
                inputData = { ...(snapshot.inputData || {}) };
                document.getElementById('ownerNameInput').value = snapshot.ownerName || '';
                document.getElementById('petNameInput').value = snapshot.petName || '';
                if (currentChartId) history.replaceState(null, '', `index.html?chart=${currentChartId}`);
                setSaveStatus('已恢复填写内容', 'saved');
                return true;
            } catch (_) {
                sessionStorage.removeItem(WORKING_DRAFT_KEY);
                return false;
            }
        }

        async function searchOwnerRecords(query) {
            const request = ++ownerSearchRequest;
            try {
                const charts = await getOwnerSearchCharts();
                if (request !== ownerSearchRequest) return;
                const normalized = query.toLocaleLowerCase('zh-CN');
                const matches = charts
                    .filter(chart => String(chart.ownerName || '').toLocaleLowerCase('zh-CN').includes(normalized))
                    .sort((a, b) => {
                        const exactA = String(a.ownerName || '').toLocaleLowerCase('zh-CN') === normalized ? 1 : 0;
                        const exactB = String(b.ownerName || '').toLocaleLowerCase('zh-CN') === normalized ? 1 : 0;
                        return exactB - exactA || Number(b.updatedAt) - Number(a.updatedAt);
                    });
                renderOwnerSearchResults(matches, query);
            } catch (_) {
                closeOwnerSearch();
                if (!currentChartId) scheduleCacheSync();
            }
        }

        async function saveChartToServer() {
            const payload = getCurrentChartPayload();
            if (!currentChartId && !hasChartContent(payload)) {
                setSaveStatus('请先填写家长、动物或至少一个牙位', 'error');
                return false;
            }
            if (cacheSyncInFlight) {
                cacheSyncDirty = true;
                return;
            }
            cacheSyncInFlight = true;
            cacheSyncDirty = false;
            setSaveStatus('正在保存...', 'saving');
            try {
                const response = await DentalApi.fetch(
                    currentChartId ? `${CHART_API}/${currentChartId}` : CHART_API,
                    {
                    method: currentChartId ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) throw new Error((await response.json()).message || '保存失败');
                const saved = await response.json();
                currentMedicalRecordId = saved.medicalRecordId || currentMedicalRecordId || saved.id;
                if (!currentChartId) {
                    currentChartId = saved.id;
                    selectedHistoryVersion = null;
                    history.replaceState(null, '', `index.html?chart=${currentChartId}`);
                }
                historicalReportsCacheKey = '';
                ownerSearchCharts = null;
                setSaveStatus('已保存', 'saved');
                persistWorkingDraft();
                if (activeReportTab === 'history') loadHistoricalReports(true);
                return true;
            } catch (error) {
                setSaveStatus(`保存失败：${error.message}`, 'error');
                return false;
            } finally {
                cacheSyncInFlight = false;
                const waiters = cacheSyncIdleWaiters.splice(0);
                waiters.forEach(resolve => resolve());
                if (cacheSyncDirty) scheduleCacheSync();
            }
        }

        function waitForCacheSyncIdle() {
            if (!cacheSyncInFlight) return Promise.resolve();
            return new Promise(resolve => cacheSyncIdleWaiters.push(resolve));
        }

        function setWorkflowBusy(busy) {

                setWorkflowBusy(false);

        function findTermCompletion(prefix) {
            if (!prefix) return null;
            const allTerms = getAllAnnotationTerms();
            const candidates = prefix.startsWith('疑')
                ? allTerms.map(term => (
                    term.startsWith('疑') ? term : '疑' + term
                ))
                : allTerms;
            return candidates.find(term => (
                term !== prefix && term.startsWith(prefix)
            )) || null;
        }

        function normalizeTermList(raw) {
            if (!raw) return [];
            return raw
                .toUpperCase()
                .split(/[\s,，;；、/]+/)
                .map(s => s.trim())
                .map(resolveTermAlias)
                .filter(Boolean);
        }

        function serializeTermList(list) {
            return list.map(getTermDisplayName).join(',\n');
        }

        const ONF_ALLOWED_TEETH = new Set([
            '101', '102', '103', '104', '105', '106', '107',
            '201', '202', '203', '204', '205', '206', '207'
        ]);

        function isOnfTerm(term) {
            return term === 'ONF' || term === '疑ONF';
        }

        function canMarkOnf(toothNum) {
            return ONF_ALLOWED_TEETH.has(String(toothNum || ''));
        }

        function notifyOnfRange() {
            setSaveStatus('口鼻瘘仅可标记 101–107、201–207', 'error');
        }

        function normalizeToothTerms(list, toothNum = '') {
            if (list.includes(DentalReport.MISSING_TOOTH_TERM)) {
                return [DentalReport.MISSING_TOOTH_TERM];
            }

            // ONF 与疑ONF互斥，后输入或后点击的一个生效
            let onfTerm = null;
            list.forEach(term => {
                if (isOnfTerm(term) && canMarkOnf(toothNum)) onfTerm = term;
            });

            const normalized = [];
            if (onfTerm) normalized.push(onfTerm);
            if (list.includes('AL')) normalized.push('AL');
            list.forEach(term => {
                if (
                    term === 'ONF' ||
                    term === '疑ONF' ||
                    term === 'AL' ||
                    normalized.includes(term)
                ) return;
                normalized.push(term);
            });
            return normalized;
        }

        function setActiveLegendTerm(term) {
            activeLegendTerm = term || null;
            document.body.classList.toggle('term-paint-mode', !!activeLegendTerm);

        function syncUsedLegendTerms() {
            const usedTerms = new Set();
            const focusedInput = document.activeElement?.closest?.('.tooth-input');
            if (focusedInput) {
                const value = focusedInput.value || '';
                const isSeparator = character => /[\s,，;；、/]/u.test(character);
                let start = focusedInput.selectionStart ?? value.length;
                let end = focusedInput.selectionEnd ?? start;
                while (start > 0 && !isSeparator(value[start - 1])) start -= 1;
                while (end < value.length && !isSeparator(value[end])) end += 1;
                const [focusedTerm] = normalizeTermList(value.slice(start, end));
                if (focusedTerm) usedTerms.add(focusedTerm);
            }
            const highlightedItems = [];
            document.querySelectorAll('.legend-item[data-term]').forEach(item => {
                const highlighted = usedTerms.has(item.dataset.term);
                item.classList.toggle('legend-item--used', highlighted);
                if (highlighted) highlightedItems.push(item);
            });
            const legend = document.querySelector('.legend');
            legend?.classList.toggle(
                'legend--has-used-other',
                highlightedItems.some(item => item.classList.contains('legend-item--no-report'))
            );
            if (!highlightedItems.length) return;
            requestAnimationFrame(() => {
                highlightedItems.forEach(item => {
                    if (!item.getClientRects().length) return;
                    const grid = item.closest('.legend-grid');
                    if (!grid) return;
                    const itemRect = item.getBoundingClientRect();
                    const gridRect = grid.getBoundingClientRect();
                    const hidden = itemRect.left < gridRect.left || itemRect.right > gridRect.right ||
                        itemRect.top < gridRect.top || itemRect.bottom > gridRect.bottom;
                    if (hidden) {
                        item.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
                    }
                });
            });
        }

        function filterLegendSearch() {

            const items = document.querySelectorAll('.legend-item[data-term]');
            let firstMatch = null;
            let hasOtherMatch = false;

            items.forEach(item => {
                const haystack = [
                    item.dataset.term || '',
                    item.dataset.chinese || '',
                    item.dataset.aliases || ''
                ].join(' ').toLowerCase();
                const match = !!q && haystack.includes(q);
                item.classList.toggle('legend-item--match', match);
                if (match && item.classList.contains('legend-item--no-report')) {
                    hasOtherMatch = true;
                }
                if (match && !firstMatch) firstMatch = item;
            });
            document.querySelector('.legend')?.classList.toggle(
                'legend--show-other-match',
                hasOtherMatch
            );

            if (firstMatch) {
                firstMatch.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        function setupLegendSearch() {
            const input = document.getElementById('legendSearch');
            if (!input) return;

            input.addEventListener('input', filterLegendSearch);
            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const first = document.querySelector('.legend-item.legend-item--match');
                    if (first) {
                        const term = first.dataset.term;
                        setActiveLegendTerm(activeLegendTerm === term ? null : term);
                    }
                    return;
                }
                if (e.key === 'Escape') {
                    input.value = '';
                    filterLegendSearch();
                }
            });
        }

        function applyToothTermList(input, list) {
            const toothNum = input.id.replace('tooth-', '');
            const next = serializeTermList(normalizeToothTerms(list, toothNum));
            input.value = next;
            inputData[toothNum] = next;
            syncUsedLegendTerms();
            centerInputContent(input);
            DentalReport.updateReport();
            scheduleCacheSync();
        }

        function toggleTermInInput(input, term) {
            const toothNum = input.id.replace('tooth-', '');
            if (isOnfTerm(term) && !canMarkOnf(toothNum)) {
                notifyOnfRange();
                return;
            }
            const list = normalizeTermList(input.value);
            const index = list.indexOf(term);
            const missing = DentalReport.MISSING_TOOTH_TERM;

            if (index >= 0) {
                list.splice(index, 1);
            } else if (term === missing) {
                list.length = 0;
                list.push(missing);
            } else if (list.includes(missing)) {
                return;
            } else {
                if (term === 'ONF' || term === '疑ONF') {
                    const counterpart = term === 'ONF' ? '疑ONF' : 'ONF';
                    const counterpartIndex = list.indexOf(counterpart);
                    if (counterpartIndex >= 0) list.splice(counterpartIndex, 1);
                }
                list.push(term);
            }
            applyToothTermList(input, list);
        }

        function addTermToInput(input, term) {
            if (!input || !term) return;
            const toothNum = input.id.replace('tooth-', '');
            if (isOnfTerm(term) && !canMarkOnf(toothNum)) {
                notifyOnfRange();
                return;
            }
            const list = normalizeTermList(input.value);
            const missing = DentalReport.MISSING_TOOTH_TERM;

            if (term === missing) {
                applyToothTermList(input, [missing]);
                return;
            }
            if (list.includes(missing) || list.includes(term)) return;
            list.push(term);
            applyToothTermList(input, list);
        }

        function removeTermFromInput(input, term) {
            if (!input || !term) return;
            const list = normalizeTermList(input.value);
            const index = list.indexOf(term);
            if (index < 0) return;
            list.splice(index, 1);
            applyToothTermList(input, list);
        }

        function paintTermOnInput(input) {
            if (!termPaintState) return;
            if (termPaintState.mode === 'remove') {
                removeTermFromInput(input, termPaintState.term);
            } else {
                addTermToInput(input, termPaintState.term);
            }
        }

        function paintInputAtPoint(clientX, clientY) {
            if (!termPaintState) return;
            const input = document.elementFromPoint(clientX, clientY)?.closest('.tooth-input');
            if (!input || termPaintState.painted.has(input)) return;
            termPaintState.painted.add(input);
            paintTermOnInput(input);
        }

        function startTermPaint(e) {
            if (!activeLegendTerm || e.button > 0) return;
            e.preventDefault();
            try {
                e.currentTarget.setPointerCapture(e.pointerId);
            } catch (_) {}
            termPaintState = {
                pointerId: e.pointerId,
                term: activeLegendTerm,
                startInput: e.currentTarget,
                startX: e.clientX,
                startY: e.clientY,
                moved: false,
                painted: new Set(),
                mode: normalizeTermList(e.currentTarget.value).includes(activeLegendTerm)
                    ? 'remove'
                    : 'add'
            };
        }

        function moveTermPaint(e) {
            if (!termPaintState || e.pointerId !== termPaintState.pointerId) return;
            const distance = Math.hypot(
                e.clientX - termPaintState.startX,
                e.clientY - termPaintState.startY
            );
            if (!termPaintState.moved && distance >= 4) {
                termPaintState.moved = true;
                termPaintState.painted.add(termPaintState.startInput);
                paintTermOnInput(termPaintState.startInput);
            }
            if (termPaintState.moved) {
                e.preventDefault();
                paintInputAtPoint(e.clientX, e.clientY);
            }
        }

        function endTermPaint(e) {
            if (!termPaintState || e.pointerId !== termPaintState.pointerId) return;
            if (!termPaintState.moved) {
                toggleTermInInput(termPaintState.startInput, termPaintState.term);
            }
            try {
                termPaintState.startInput.releasePointerCapture(e.pointerId);
            } catch (_) {}
            termPaintState = null;
        }

        // 根据容器高度计算输入框响应尺寸
        function calcInputSize() {
            const chartContainer = document.getElementById('chartContainer');
            const h = chartContainer.offsetHeight;
            if (!h) return { height: 22, fontSize: 10 };
            // 单个牙位网格行约占图高 16%，输入区取 12%，留出上下边界
            const inputH = Math.min(96, Math.max(14, Math.round(h * 0.12)));
            const inputFS = Math.min(15, Math.max(10, Math.round(inputH * 0.42)));
            return { height: inputH, fontSize: inputFS };
        }

        // 用隐藏节点实测文字宽度：canvas 的字体串在部分平台会被静默忽略，导致测量偏小
        let toothTextRuler = null;

        function getToothTextRuler() {
            if (!toothTextRuler) {
                toothTextRuler = document.createElement('span');
                toothTextRuler.setAttribute('aria-hidden', 'true');
                toothTextRuler.style.cssText = [
                    'position:absolute', 'left:-9999px', 'top:-9999px',
                    'visibility:hidden', 'white-space:pre', 'pointer-events:none'
                ].join(';');
                document.body.appendChild(toothTextRuler);
            }
            return toothTextRuler;
        }

        function measureToothTextWidth(input, fontSize) {
            const lines = (input.value || '').split('\n');
            if (!lines.length) return 0;
            const ruler = getToothTextRuler();
            const style = getComputedStyle(input);
            ruler.style.fontFamily = style.fontFamily;
            ruler.style.fontWeight = style.fontWeight;
            ruler.style.fontStyle = style.fontStyle;
            ruler.style.letterSpacing = style.letterSpacing;
            ruler.style.fontSize = fontSize + 'px';
            let widest = 0;
            for (const line of lines) {
                ruler.textContent = line;
                widest = Math.max(widest, ruler.getBoundingClientRect().width);
            }
            return widest;
        }

        // textarea 默认顶端对齐；按当前行数计算上内边距，使标注在单元格中垂直居中
        function centerInputContent(input) {
            const baseFontSize = parseFloat(input.dataset.baseFontSize) ||
                parseFloat(getComputedStyle(input).fontSize) || 11;
            let fontSize = baseFontSize;
            input.style.fontSize = fontSize + 'px';

            // 长术语按单元格宽度自动缩小（兼容 Windows 中文字体更宽）
            const cellWidth = input.clientWidth || input.getBoundingClientRect().width;
            const availableWidth = Math.max(0, cellWidth - 1);
            const overflows = () => (
                measureToothTextWidth(input, fontSize) > availableWidth ||
                input.scrollWidth > input.clientWidth + 0.5
            );
            while (input.value && availableWidth > 0 && fontSize > 5 && overflows()) {
                fontSize -= 0.5;
                input.style.fontSize = fontSize + 'px';
            }

            const lineHeight = fontSize * 1.1;
            const lineCount = Math.max(1, (input.value || '').split('\n').length);
            const contentHeight = lineCount * lineHeight;
            const paddingTop = Math.max(1, (input.clientHeight - contentHeight - 4) / 2);
            input.style.paddingTop = paddingTop + 'px';
            input.style.paddingBottom = '1px';
            input.style.paddingLeft = '0';
            input.style.paddingRight = '0';
            input.scrollTop = 0;
            input.scrollLeft = 0;
        }

        // 更新已有输入框的尺寸（窗口变化时调用）
        function updateInputSizes() {
            const { height, fontSize } = calcInputSize();
            document.querySelectorAll('.tooth-input').forEach(input => {
                input.style.height = height + 'px';
                input.style.fontSize = fontSize + 'px';
                input.dataset.baseFontSize = fontSize;
                centerInputContent(input);
            });
        }

        // 初始化输入框
        function initInputs() {
            const container = document.getElementById('inputsContainer');
            container.innerHTML = '';
            const config = currentChartType === 'dog' ? dogTeethConfig : catTeethConfig;
            const { height, fontSize } = calcInputSize();

            // 为每个象限创建输入框
            ['maxillaRight', 'maxillaLeft', 'mandibleRight', 'mandibleLeft'].forEach(quadrant => {
                const teeth = config[quadrant];
                const posConfig = config.positions[quadrant];

                teeth.forEach((toothNum, index) => {
                    const input = document.createElement('textarea');
                    input.className = 'tooth-input';
                    input.id = `tooth-${toothNum}`;
                    input.placeholder = toothNum;
                    input.autocomplete = 'off';
                    input.spellcheck = false;
                    input.rows = 1;
                    input.maxLength = 50; // 允许输入多个术语
                    input.readOnly = viewOnlyMode;
                    if (viewOnlyMode) input.setAttribute('aria-readonly', 'true');

                    const pos = posConfig.rows[index];
                    input.style.top = posConfig.top;
                    input.style.left = pos.left;
                    input.style.width = pos.width;
                    input.style.height = height + 'px';
                    input.style.fontSize = fontSize + 'px';
                    input.dataset.baseFontSize = fontSize;

                    input.value = serializeTermList(normalizeToothTerms(
                        normalizeTermList(inputData[toothNum] || ''),
                        toothNum
                    ));
                    inputData[toothNum] = input.value;
                    let isComposing = false;
                    const syncInputValue = (target, inputType = '') => {
                        const raw = target.value.toUpperCase();
                        const hasTrailingSeparator = /[\s,，;；、/]$/u.test(raw);
                        const isDeleting = inputType.startsWith('delete');
                        const rawTerms = normalizeTermList(raw);
                        if (rawTerms.some(isOnfTerm) && !canMarkOnf(toothNum)) {
                            notifyOnfRange();
                        }
                        let list = normalizeToothTerms(rawTerms, toothNum);
                        let completionSelection = null;

                        // 仅补齐正在输入的最后一个术语；删除时保持逐字删除
                        if (!isDeleting && !hasTrailingSeparator && list.length) {
                            const typed = list[list.length - 1];
                            const completion = findTermCompletion(typed);
                            if (completion) {
                                list[list.length - 1] = completion;
                                completionSelection = {
                                    typedLength: typed.length,
                                    completion: getTermDisplayName(completion)
                                };
                            }
                        }

                        list = normalizeToothTerms(list, toothNum);
                        let next = serializeTermList(list);

                        // 用户刚输入分隔符时保留换行，便于继续输入下一类牙病
                        // 删除时不补回尾部分隔符，确保 Backspace/Delete 可以正常清除内容
                        if (
                            !isDeleting &&
                            hasTrailingSeparator &&
                            list.length &&
                            !list.includes(DentalReport.MISSING_TOOTH_TERM)
                        ) {
                            next += ',\n';
                        }

                        target.value = next;
                        if (completionSelection) {
                            const termStart = next.indexOf(completionSelection.completion);
                            if (termStart >= 0) {
                                target.setSelectionRange(
                                    termStart + completionSelection.typedLength,
                                    termStart + completionSelection.completion.length
                                );
                            }
                        }
                        inputData[toothNum] = next;
                        syncUsedLegendTerms();
                        centerInputContent(target);
                        DentalReport.updateReport();
                        scheduleCacheSync();
                    };

                    input.addEventListener('compositionstart', () => {
                        isComposing = true;
                    });
                    input.addEventListener('compositionend', (e) => {
                        isComposing = false;
                        syncInputValue(e.target);
                    });
                    input.addEventListener('input', (e) => {
                        if (isComposing || e.isComposing) return;
                        syncInputValue(e.target, e.inputType || '');
                    });
                    input.addEventListener('focus', syncUsedLegendTerms);
                    input.addEventListener('click', syncUsedLegendTerms);
                    input.addEventListener('keyup', syncUsedLegendTerms);
                    input.addEventListener('blur', () => {
                        requestAnimationFrame(syncUsedLegendTerms);
                    });
                    input.addEventListener('keydown', (e) => {
                        const isSeparator = e.key === 'Enter' || /^[,，;；、/ ]$/u.test(e.key);
                        if (
                            isSeparator &&
                            e.target.selectionStart !== e.target.selectionEnd
                        ) {
                            // 输入分隔符表示接受当前自动补齐结果
                            e.target.setSelectionRange(
                                e.target.selectionEnd,
                                e.target.selectionEnd
                            );
                        }
                    });

                    input.addEventListener('pointerdown', startTermPaint);

                    container.appendChild(input);
                    centerInputContent(input);
                });
            });
            syncUsedLegendTerms();
        }

        // 切换牙表类型
        function switchChart(type) {
            if (viewOnlyMode) return;
            if (type === currentChartType) return;
            currentChartType = type;
            scheduleCacheSync();
            const image = document.getElementById('chartImage');

            document.getElementById('btn-dog').classList.toggle('active', type === 'dog');
            document.getElementById('btn-cat').classList.toggle('active', type === 'cat');
            document.getElementById('btn-rabbit').classList.toggle('active', type === 'rabbit');

            // 兔为独立体系：仅显示图片，隐藏标注、术语说明与报告
            const isRabbit = type === 'rabbit';
            document.body.classList.toggle('rabbit-mode', isRabbit);
            document.body.classList.toggle('cat-mode', type === 'cat');

            image.onload = null;
            image.src = CHART_IMAGES[type];

            if (isRabbit) return;

            // inputData 已实时同步，initInputs() 会直接从中读取恢复值，无需额外保存
            const doInit = () => {
                initInputs();
                loadPositions();
                DentalReport.updateReport();
            };

            // 图片已缓存时 onload 可能不触发，用 image.complete 兜底
            if (image.complete) {
                doInit();
            } else {
                image.onload = doInit;
            }
        }

                btn.setAttribute('aria-label', '再次点击确认清空');

                // 2.5秒后自动退出确认模式
                clearConfirmTimeout = setTimeout(function() {
                    resetClearButton();
                }, 2500);
            } else {

                    clearConfirmTimeout = null;

        // 重置清空按钮状态
        function resetClearButton() {
            const btn = document.querySelector('.btn-clear');
            if (!clearConfirmMode) return; // 如果已经重置，直接返回
            
            clearConfirmMode = false;
            btn.classList.remove('confirm-mode');
            btn.textContent = '清空';

        function copyReportText(textareaId, btn) {
            const el = document.getElementById(textareaId);
            if (!el) return;
            const text = (el.value || '').trim();
            if (!text || text === DentalReport.REPORT_EMPTY_TEXT) return;

            const setCopiedState = () => {
                if (!btn) return;
                const oldLabel = btn.getAttribute('aria-label') || '复制';
                const oldTitle = btn.title;
                btn.classList.add('copied');
                btn.setAttribute('aria-label', '已复制');
                btn.title = '已复制';
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.setAttribute('aria-label', oldLabel);
                    btn.title = oldTitle;
                }, 1200);
            };

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(setCopiedState).catch(() => {
                    el.focus();
                    el.select();
                    try {
                        document.execCommand('copy');
                        setCopiedState();
                    } catch (_) {}
                });
                return;
            }

            el.focus();
            el.select();
            try {
                document.execCommand('copy');
                setCopiedState();
            } catch (_) {}
        }

        function loadPositions() {
            localStorage.removeItem(`toothPositions_${currentChartType}`);
            const saved = localStorage.getItem(`toothPositions_v2_${currentChartType}`);
            if (saved) {
                try {
                    const config = JSON.parse(saved);
                    if (config.positions) {
                        Object.keys(config.positions).forEach(toothNum => {
                            const input = document.getElementById(`tooth-${toothNum}`);
                            if (input && config.positions[toothNum]) {
                                input.style.left = config.positions[toothNum].left;
                                input.style.top = config.positions[toothNum].top;
                                if (config.positions[toothNum].width) {
                                    input.style.width = config.positions[toothNum].width;
                                }
                            }
                        });
                    }
                } catch (e) {
                    console.error('加载位置配置失败:', e);
                }
            }
        }

                    description: '牙龈增生是指牙龈组织的过度生长，表现为牙龈体积增大、质地变厚。可能由药物（如某些抗癫痫药）、慢性炎症、遗传因素或激素变化引起。'
                },
                'GV': {
                    chinese: '牙龈切除术',
                    english: 'Gingivectomy',

                },
                'GP': {

                },
                'LPS': {
                    chinese: '淋巴细胞浆细胞性口炎',

                },
                'M': {

                    english: 'Mobility',

                },
                '0': {
                    chinese: '缺失',
                    english: 'Missing',

                },
                'OP': {
                    chinese: '牙体修复术',
                    english: 'Operative',
                    description: '牙体修复术是指修复受损牙齿结构的手术，包括充填、嵌体、全冠等修复方式。用于治疗龋齿、牙齿缺损、骨折等情况，恢复牙齿的功能和形态。'
                },
                'OM': {
                    chinese: '口腔肿瘤',
                    english: 'Oral Mass',
                    description: '口腔肿瘤是指发生在口腔内的任何异常肿块或肿瘤，可能是良性或恶性。包括牙龈瘤、鳞状细胞癌、纤维肉瘤等，需要影像学检查和组织活检来确诊和制定治疗方案。'
                },
                'ONF': {
                    chinese: '口鼻瘘',
                    english: 'Oronasal Fistula',
                    description: '口鼻瘘是指口腔和鼻腔之间形成的异常通道，最常见于上颌犬齿或前臼齿的根尖区域。通常由严重的牙周病、根尖周炎或拔牙后愈合不良引起，需要手术修复。'
                },
                'PE': {
                    chinese: '牙髓暴露',
                    english: 'Pulp Exposure',
                    description: '牙髓暴露是指牙髓腔由于龋齿、外伤或磨损而暴露在口腔环境中。暴露的牙髓容易感染，通常会引起疼痛和炎症，需要及时进行根管治疗或拔除。'
                },
                'PP': {
                    chinese: '牙周袋',
                    english: 'Periodontal Pocket',
                    description: '牙周袋是指牙龈与牙根表面之间形成的病理性深沟，深度超过正常的龈沟（通常>3mm）。是牙周病的重要表现，由牙龈附着丧失和牙槽骨吸收形成，需要专业清洁和治疗。'
                },
                'RD': {
                    chinese: '乳齿未脱',
                    english: 'Retained Deciduous',
                    description: '乳齿未脱是指乳牙在其正常脱落时间之后仍然保留在口腔内，而恒牙已经开始萌出。常见于小型犬，可能导致恒牙错位、咬合问题或牙周疾病，通常需要拔除滞留的乳牙。'
                },
                'RE': {
                    chinese: '齿根暴露',
                    english: 'Root Exposure',
                    description: '齿根暴露是指牙根表面因牙龈退缩而暴露在口腔中。可能由牙周病、刷牙方式不当、咬合创伤或年龄因素引起，暴露的牙根对冷热刺激敏感，容易发生龋齿。'
                },
                'RL': {
                    chinese: '再吸收损伤',
                    english: 'Resorptive Lesion',
                    description: '再吸收损伤是指牙齿硬组织（通常是牙根或牙颈部）被破骨细胞逐渐吸收的病变。在猫中特别常见，也可见于犬，病因尚不完全清楚，可能与炎症、免疫反应或代谢因素有关。'
                },
                'ROT': {
                    chinese: '牙齿旋转',
                    english: 'Rotation',
                    description: '牙齿旋转是指牙齿沿其长轴发生旋转，偏离正常位置。可能由牙齿拥挤、乳牙滞留、外伤或遗传因素引起，影响咬合功能和美观。'
                },
                'RPC': {
                    chinese: '牙根整平术，闭合式',
                    english: 'Root Planing, Closed',
                    description: '闭合式牙根整平术是通过龈下刮治去除牙根表面的牙结石和病变牙骨质，而不需要切开牙龈的手术方式。适用于中度牙周病，可以清除牙周袋内的细菌和沉积物。'
                },
                'RPO': {
                    chinese: '牙根整平术，开放式',
                    english: 'Root Planing, Open',
                    description: '开放式牙根整平术是在切开并翻开牙龈瓣后进行的牙根表面清洁和整平手术。适用于深牙周袋或闭合式治疗无法充分清洁的情况，可以更彻底地清除病变组织。'
                },
                'RTR': {
                    chinese: '齿根残留',

                },
                'X': {
                    chinese: '拔牙',
                    english: 'Extraction',
                    description: '拔牙是指将牙齿从牙槽骨中完整移除的手术。通常用于治疗无法修复的严重龋齿、牙周病、骨折或感染的牙齿，是牙科治疗中的常见手术操作。'
                },
                'XS': {
                    chinese: '拔牙，切开齿龈瓣',
                    english: 'Extraction with Sectioning',
                    description: '切开齿龈瓣拔牙是指通过切开并翻开牙龈组织来暴露牙齿和牙根，然后进行拔除的手术方法。适用于复杂拔牙、根分叉暴露的多根牙或需要充分视野的手术。'
                },
                'XSS': {
                    chinese: '拔牙，手术',
                    english: 'Extraction, Surgical',
                    description: '外科拔牙是指需要额外外科操作（如骨切除、牙齿分片、根尖切除等）的复杂拔牙手术。适用于阻生牙、严重弯曲的牙根、根尖病变或需要完全取出所有牙体组织的复杂情况。'
                },
                '疑ONF': {
                    chinese: '疑口鼻瘘',
                    english: 'Suspected Oronasal Fistula'
                },
                '髓腔增宽': {
                    chinese: '髓腔增宽',
                    english: 'Widened Pulp Cavity',
                    display: '髓腔增宽'
                }
            };

            // 已支持自动报告的术语靠前，其余保持原相对顺序
            sortedTermsOrder.forEach(term => {
                    const item = document.createElement('div');
                    const hasReportRule = DentalReport.hasReportRule(term);
                    item.className = 'legend-item' +
                        (hasReportRule ? '' : ' legend-item--no-report') +
                        (priorityTerms.includes(term) ? ' legend-item--priority' : '');
                    item.dataset.term = term;
                    
                    const customInfo = customTerms.find(item => item.abbreviation === term);
                    const info = termInfo[term] || {
                        chinese: customInfo?.fullName || '自定义标签',
                        english: 'Custom term',
                        display: customInfo?.fullName ? `${term}-${customInfo.fullName}` : term
                    };
                    item.dataset.chinese = info.chinese;
                    item.dataset.english = info.english;
                    item.dataset.aliases = term === 'AL' ? 'PD' : term === '0' ? 'O' : '';
                    item.textContent = info.display || term + '-' + info.chinese;
                    item.addEventListener('click', function (e) {
                        e.preventDefault();
                        e.stopPropagation();
                        setActiveLegendTerm(activeLegendTerm === term ? null : term);
                    });

                    (hasReportRule ? primaryGrid : otherGrid).appendChild(item);
            });
            if (addBtn) primaryGrid.appendChild(addBtn);
            syncUsedLegendTerms();
        }

        // DOM 可用后立即初始化，不等待图片、视频等媒体资源。
        document.addEventListener('DOMContentLoaded', async function() {
            const [loadedRequestedChart] = await Promise.all([loadRequestedChart(), loadCustomTerms(false)]);
            if (!loadedRequestedChart) restoreWorkingDraftFromSession();
            document.getElementById('btn-dog').classList.toggle('active', currentChartType === 'dog');
            document.getElementById('btn-cat').classList.toggle('active', currentChartType === 'cat');
            document.getElementById('btn-rabbit').classList.toggle('active', currentChartType === 'rabbit');
            document.body.classList.toggle('rabbit-mode', currentChartType === 'rabbit');
            document.body.classList.toggle('cat-mode', currentChartType === 'cat');
            document.getElementById('chartImage').src = CHART_IMAGES[currentChartType];
            initLegend();
            setInterval(() => loadCustomTerms(true), 30000);
            setupLegendSearch();
            resetLegendState();
            initInputs();
            loadPositions();
            DentalReport.updateReport();
            applyViewOnlyMode();
            const ownerNameInput = document.getElementById('ownerNameInput');
            if (!viewOnlyMode) {
                ownerNameInput?.addEventListener('input', handleOwnerNameInput);
                ownerNameInput?.addEventListener('focus', () => {
                    getOwnerSearchCharts().catch(() => {});
                    if (ownerNameInput.value.trim()) handleOwnerNameInput();
                });
                ownerNameInput?.addEventListener('keydown', event => {
                    if (event.key === 'Escape') closeOwnerSearch();
                });
                document.getElementById('petNameInput')?.addEventListener('input', scheduleCacheSync);
            }
            document.getElementById('chartContainer')?.addEventListener('dragstart', (e) => {
                e.preventDefault();
            });

            // 窗口缩放时更新输入框尺寸
            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(updateInputSizes, 80);
            });

            // 字体与牙表底图加载完成后字宽才最终确定，需重新自适应一次
            window.addEventListener('load', updateInputSizes);
            document.fonts?.ready?.then(updateInputSizes);

            // 点击页面其他地方时取消清空确认状态
            document.addEventListener('click', function(e) {
                if (clearConfirmMode && !e.target.closest('.btn-clear')) {
                    resetClearButton();
                }
                if (!e.target.closest('.owner-search-field')) closeOwnerSearch();
            });

            document.addEventListener('pointermove', moveTermPaint, { passive: false });
            document.addEventListener('pointerup', endTermPaint);
            document.addEventListener('pointercancel', endTermPaint);
            window.addEventListener('pagehide', persistWorkingDraft);

        });
    </script>
</body>
</html>
