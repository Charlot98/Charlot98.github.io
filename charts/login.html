<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 - 统计看板</title>
  <link rel="icon" href="statistics.png" type="image/png" />
  <link rel="stylesheet" href="css/common.css?v=20260802l" />
  <link rel="stylesheet" href="css/login.css?v=20260802b" />
</head>
<body>
  <div class="login-card" hidden>
    <div class="login-title">统计看板登录</div>
    <form id="login-form">
      <label for="username">账户名</label>
      <input id="username" name="username" type="text" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9_-]{2,31}" required />
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <div id="error" class="error"></div>
      <button id="login-btn" class="login-btn" type="submit" disabled>登录</button>
    </form>
  </div>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
